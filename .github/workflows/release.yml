# Flight Deck release.
#
# Trigger: MANUAL only (workflow_dispatch) — no push trigger for now. Built from the
# current state of `main`, the only ref a release may run on (see "Signing keys" below).
#
# What it does:
#   1. `authorize` — only the accounts in ALLOWED may release, and only from `main`.
#   2. `prepare` — resolves the version (src-tauri/tauri.conf.json) and refuses one
#      that is already released, BEFORE any macOS runner is booked.
#   3. `daemon` + `daemon-macos` — build the four flightdeckd binaries (Linux musl ×2,
#      macOS ×2) ONCE, packaged with their manifest, for every app to bundle.
#   4. `build` — a MATRIX, one leg per platform: macOS Apple Silicon (aarch64) and
#      macOS Intel (x86_64). Separate builds, not a universal bundle: a matrix is the
#      shape that scales to Linux/Windows later. The Intel leg is CROSS-compiled on
#      the arm64 runner — GitHub is retiring its Intel macOS runners. On Intel the
#      wake word is compiled out: the `ort` crate (ONNX Runtime) ships no
#      x86_64-apple-darwin build (see Cargo.toml and src-tauri/src/wake/mod.rs).
#      Each leg code-signs its app, VERIFIES its own signature, CPU architecture and
#      bundled daemons, packs the updater archive (unsigned), and hands its files over
#      as a workflow artifact. No leg touches the GitHub release, nor the updater key.
#   5. `sign` — signs the legs' updater archives with the updater key, in a job of its
#      own that runs only the Tauri CLI's pinned signing binary and the pinned artifact
#      actions (see "Signing keys" below).
#   6. `publish` — runs only once EVERY leg has been built and signed: assembles
#      `latest.json` (and stops unless every expected platform is in it), checks every
#      signature in it against the key the installed apps pin, creates the release as
#      a DRAFT carrying every file, checks the uploaded assets, then publishes. Nothing
#      becomes visible before that.
#
# Updater: installed apps all read ONE manifest
# (releases/latest/download/latest.json) and take the line for their own platform
# (darwin-aarch64 / darwin-x86_64) — before comparing versions: an app whose platform
# is missing gets an error, not "up to date". Hence the all-or-nothing `publish`.
#
# Dry run (`dry_run: true`): builds, signs and verifies everything, then leaves a DRAFT
# under a throwaway tag (`dryrun-vX.Y.Z-<run id>`): nothing published, no git tag, no
# effect on installed apps. Inspect it, then delete it (the run summary says how).
# Like any release it runs from `main` only — the signing keys never reach another
# branch — so it is the step between merging a change to this workflow and the real
# release: `gh workflow run release.yml --ref main -f dry_run=true`.
#
# "A bit secured":
#   - only the accounts in ALLOWED produce a release: anyone else fails at `authorize`
#     BEFORE any build (collaborators with write access still see the button on
#     GitHub, but their run does nothing);
#   - anti-duplicate guard: a version that already has a release is refused.
#
# Signing keys are reserved for `main`, in two GitHub Environments whose deployment
# branch policy only admits `main`:
#   - `release` — the macOS code-signing certificate (APPLE_CERTIFICATE,
#     APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY). Only the `build` legs enter it.
#   - `updater-signing` — the updater key (TAURI_SIGNING_PRIVATE_KEY, under a passphrase:
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD). Only `sign` enters it.
# The updater key is the one every installed app trusts for an update, and it cannot be
# replaced without ending auto-update for all of them. So it never enters a job that runs
# the build: `pnpm build` loads Vite and every npm package it pulls in, and a compromised
# one could read any secret its job holds (GitHub only scrubs from a runner's memory the
# secrets nothing in the workflow references, and macOS runners give sudo). A separate
# Environment, not just a separate job, is what keeps the key out of the build legs'
# reach. `sign` runs no checkout, no npm, no code of ours — only a binary pinned by its
# hash and GitHub's artifact actions pinned by commit.
# What it cannot help: a compromised build can still tamper with the archive it hands
# over; the key, though, never leaves `sign`.
# A run dispatched from any other branch is refused by `authorize` below and,
# independently of this file, by GitHub at each environment gate — so an edited copy of
# this workflow on another branch never sees the keys. Keep the signing secrets OUT of
# the repository-level secrets: those are readable by a workflow on any branch, which
# would undo this. Put the updater key under a passphrase / change it with
# scripts/updater-key.mjs (same key pair; it checks it against the pinned public key).
#
# Versioning: the version comes from src-tauri/tauri.conf.json. Bump BEFORE running
# (see CLAUDE.md « Versioning & releases », `pnpm bump`). The workflow refuses to run
# when a release already carries that number → it forces an increment.
name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Marquer la release comme pré-release"
        type: boolean
        default: false
      dry_run:
        description: "Dry run: build, sign and verify everything, publish nothing (leaves a draft to inspect)"
        type: boolean
        default: false

# Une seule release à la fois.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Garde-fou n°1 : qui a le droit de publier. Tourne sur un runner léger pour
  # bloquer AVANT de réserver le runner macOS si l'acteur n'est pas autorisé.
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier l'autorisation du déclencheur
        env:
          # Comptes GitHub autorisés à publier une release (séparés par des espaces).
          # clousty8 (Armand) ajouté pour la v1.10.0 — Alexandre en vacances.
          ALLOWED: "Alex375 clousty8"
        run: |
          if [[ " ${ALLOWED} " != *" ${{ github.actor }} "* ]]; then
            echo "::error::@${{ github.actor }} n'est pas autorisé à publier une release (autorisés : ${ALLOWED})."
            exit 1
          fi
          echo "✓ @${{ github.actor }} est autorisé à publier."

      # Only `main` is released: whoever dispatches, the code that gets signed is the
      # code on `main`. The ref travels through env, never inlined into the script.
      # A dry run too — it signs as much as a real release does.
      - name: Refuse any ref other than main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != "refs/heads/main" ]]; then
            echo "::error::Releases are built from main only (this run targets $REF)."
            exit 1
          fi
          echo "✓ Releasing from main."

  # The version and the tag it will be released under, resolved ONCE for every job —
  # and refused here, on a cheap runner, when that version is already released.
  prepare:
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: write # may delete a residual draft (see below)
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the version and the release tag
        id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$DRY_RUN" = "true" ]; then
            # A throwaway tag: a dry run can never collide with — or turn into — a
            # real release, even for a version that is already out.
            TAG="dryrun-v${VERSION}-${GITHUB_RUN_ID}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION — release tag: $TAG"

      - name: Refuse a version that is already released
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # `gh release view` sees DRAFTS too. The distinction matters:
          #  - a PUBLISHED release of this version → stop (forces a bump);
          #  - a residual DRAFT (an earlier run that failed after creating it, in
          #    `publish`) must NOT block a re-run: delete it and start clean (a draft
          #    creates no git tag → no ref to clean up).
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            if [ "$IS_DRAFT" = "true" ]; then
              echo "⚠️ Residual draft $TAG (an earlier run failed) → deleting it before rebuilding."
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            else
              echo "::error::Release $TAG already exists (published). Bump the version (see CLAUDE.md « Versioning & releases », \`pnpm bump\`) before running again."
              exit 1
            fi
          fi
          echo "✓ $TAG is free."

  # Builds the static musl flightdeckd binaries (B2/B3) that every `build` leg bundles
  # into the app (src-tauri/resources/flightdeckd/, tauri.conf.json's bundle.resources —
  # resolved at runtime by bootstrap::install::daemon_binary_path/
  # bundled_daemon_manifest). ubuntu-latest: only Docker + Node needed (no Xcode/
  # signing) — see ci.yml's own `flightdeckd` job for the same reasoning on tests.
  # Pinned tooling (the builder image by DIGEST + exact cargo-zigbuild/zig apk package
  # versions — see flightdeckd/scripts/musl-builder.Dockerfile's own doc) for a
  # reproducible release build; `cargo zigbuild --locked` is already the default in
  # build-musl.sh. This job NEVER receives signing secrets — it only ever touches
  # Docker + crates.io. The two macOS daemons (what an update of an existing macOS
  # LaunchAgent install sends) can't be built here — Apple's SDK and linker only exist
  # on a Mac — so `daemon-macos` builds them and packages all four.
  daemon:
    needs: authorize
    runs-on: ubuntu-latest
    # Least privilege: this job only checks out the repo (read), builds via Docker,
    # and uploads a workflow artifact (its own permission model, not `contents`) —
    # it never writes to the repo, so it does not need the workflow-level `contents:
    # write` the `prepare`/`publish` jobs actually require.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build both musl binaries (pinned tooling)
        env:
          # rust:1-alpine pinned by digest — resolves (as of this pin) to rustc 1.98.1 /
          # Alpine 3.24.2 / cargo-zigbuild 0.23.4-r0 / zig 0.16.0-r1, the exact versions
          # flightdeckd/docs/B0-MUSL-SPIKE.md verified against. Re-pin deliberately (not
          # on every release) when the crate needs a newer toolchain — `docker manifest
          # inspect rust:1-alpine` (or `curl` the registry API) gets the current digest.
          RUST_IMAGE: "rust:1-alpine@sha256:7cc1c22d77d9432f7fe012a70e6d3e555af54c2a6832700ed7d553f1769ae89f"
          CARGO_ZIGBUILD_VERSION: "0.23.4-r0"
          ZIG_VERSION: "0.16.0-r1"
        run: node scripts/build-daemon.mjs

      - name: Smoke-test the native-arch (x86_64) binary
        # Only the native arch here — the aarch64 half would need docker/setup-qemu-
        # action to run under emulation on this x86_64 runner; the cross-compile itself
        # (zig, not emulation) already proved reliable per B0-MUSL-SPIKE.md, and the
        # aarch64 binary is exercised for real by flightdeckd's own `live/m1` container
        # + the app's `#[ignore]`d live tests, separately from this workflow.
        run: TARGETS=x86_64-unknown-linux-musl flightdeckd/scripts/smoke-musl.sh

      # The raw binaries, not the packaged resources dir: `daemon-macos` re-packages them
      # with the macOS ones into ONE manifest (scripts/build-daemon.mjs --include-prebuilt).
      - name: Upload the musl binaries
        uses: actions/upload-artifact@v4
        with:
          name: flightdeckd-daemon
          path: |
            flightdeckd/target/musl/dist/flightdeckd-x86_64-unknown-linux-musl
            flightdeckd/target/musl/dist/flightdeckd-aarch64-unknown-linux-musl
          if-no-files-found: error
          retention-days: 1

  # The two macOS daemons, built ONCE here and packaged with the musl ones into the
  # resources dir every `build` leg bundles. Once, not per leg: two independent builds
  # are not byte-identical, and the app judges a server's daemon current by its sha256
  # against the bundled manifest — an Intel and an Apple-silicon Mac managing the same
  # server would each take the other's install for a stale one. Needs a Mac (Apple's SDK
  # and linker), never the signing secrets (the daemons are ad-hoc signed).
  daemon-macos:
    needs: daemon
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust (both macOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./flightdeckd -> target
          key: daemon-macos

      # Into the musl dist dir, where the packaging step below picks them up next to
      # the macOS builds.
      - name: Download the flightdeckd musl binaries (daemon job)
        uses: actions/download-artifact@v4
        with:
          name: flightdeckd-daemon
          path: flightdeckd/target/musl/dist/

      # Ad-hoc signed BEFORE they are hashed (an Apple-silicon Mac runs no unsigned
      # binary, and the app is code-signed with these files inside it), then packaged
      # together with the musl ones into src-tauri/resources/flightdeckd/ under ONE
      # manifest — see scripts/build-daemon.mjs's own header.
      - name: Build the macOS flightdeckd binaries and package all four
        env:
          TARGETS: "x86_64-apple-darwin aarch64-apple-darwin"
        run: node scripts/build-daemon.mjs --include-prebuilt

      # Both macOS builds are RUN, not just inspected: the x86_64 one is exactly what
      # "Update the daemon" uploads to an Intel Mac server, so a cross-built binary that
      # crashes at start or reports the wrong version must never ship. The native one
      # runs as is; the other runs under Rosetta 2 on an Apple-silicon runner (installed
      # here if the image lacks it). Where it truly can't run (an Intel runner can't run
      # arm64), its Mach-O architecture is still checked, with a warning saying so.
      # Every build must also carry a valid signature.
      - name: Smoke-test both macOS binaries
        run: |
          set -euo pipefail
          DIR=src-tauri/resources/flightdeckd
          WANT="flightdeckd $(node -p "require('./$DIR/manifest.json').version")"
          RUNNER="$(uname -m)"
          if [ "$RUNNER" = arm64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license || true
          fi
          for t in x86_64-apple-darwin aarch64-apple-darwin; do
            BIN="$DIR/flightdeckd-$t"
            case "$t" in
              x86_64-*) MACHO=x86_64 ;;
              aarch64-*) MACHO=arm64 ;;
            esac
            ARCHS="$(lipo -archs "$BIN")"
            if [ "$ARCHS" != "$MACHO" ]; then
              echo "::error::flightdeckd-$t is a '$ARCHS' Mach-O, expected '$MACHO'"
              exit 1
            fi
            codesign --verify --strict "$BIN"
            if [ "$MACHO" = "$RUNNER" ]; then
              GOT="$("$BIN" --version)"
            elif [ "$MACHO" = x86_64 ] && arch -x86_64 /usr/bin/true 2>/dev/null; then
              GOT="$(arch -x86_64 "$BIN" --version)"
            else
              echo "::warning::flightdeckd-$t can't run on this $RUNNER runner — only its architecture ($ARCHS) and signature were checked"
              continue
            fi
            if [ "$GOT" != "$WANT" ]; then
              echo "::error::flightdeckd-$t --version said '$GOT', expected '$WANT'"
              exit 1
            fi
            echo "✓ flightdeckd-$t: $GOT ($ARCHS, valid signature)"
          done

      - name: Hand the packaged daemons over to `build`
        uses: actions/upload-artifact@v4
        with:
          name: flightdeckd-resources
          path: src-tauri/resources/flightdeckd/
          if-no-files-found: error
          retention-days: 1

  # One leg per platform. A leg builds, signs and verifies its app, then hands its
  # release files to `publish` as a workflow artifact — it never touches the GitHub
  # release, so two legs can never race on it (nor on latest.json).
  # Adding a platform = a matrix entry here + its key in `publish`'s
  # EXPECTED_PLATFORMS. The verify/stage steps below are macOS-shaped (.app, .dmg,
  # codesign): a Linux/Windows leg will need its own.
  build:
    name: build (${{ matrix.name }})
    needs: [prepare, daemon-macos]
    # The code-signing secrets are scoped to this environment (main only — see the
    # header). Never the updater key: that one lives in `updater-signing`, for `sign`.
    environment: release
    strategy:
      # The release is all-or-nothing anyway: one failed leg cancels the others.
      fail-fast: true
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            # Its key in latest.json (what the updater of an installed app looks up).
            platform: darwin-aarch64
            # Arch label in the file names — Tauri's own (`…_aarch64.dmg`).
            arch: aarch64
            # What `lipo -archs` must report for the app's executable.
            binary_arch: arm64
          - name: macOS Intel
            # An arm64 runner too: the Intel app is cross-compiled.
            runner: macos-latest
            target: x86_64-apple-darwin
            platform: darwin-x86_64
            arch: x64
            binary_arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 (≥ 22.13) requis par pnpm@11.7.0 (champ packageManager) :
          # pnpm 11 utilise le builtin `node:sqlite`, absent avant Node 22.
          node-version: 22
          cache: pnpm

      - name: Setup Rust (toolchain + this leg's target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          # One cache per target: the legs build different artifacts and must not
          # overwrite each other's cache entry.
          key: ${{ matrix.target }}

      # --ignore-scripts: no dependency code runs at install time — the build itself
      # (Vite, esbuild, rollup) needs none, their native binaries arrive as optional
      # dependencies. pnpm already only allows esbuild's (pnpm-workspace.yaml
      # `allowBuilds`), a binary check the build does without.
      - name: Installer les dépendances JS
        run: pnpm install --frozen-lockfile --ignore-scripts

      # B2/B3: the packaged daemons (`daemon-macos`), in place BEFORE the Tauri build —
      # tauri.conf.json's bundle.resources only ever bundles what is already on disk at
      # that point.
      - name: Download the packaged flightdeckd daemons (daemon-macos job)
        uses: actions/download-artifact@v4
        with:
          name: flightdeckd-resources
          path: src-tauri/resources/flightdeckd/

      # Fails IMMEDIATELY and LOUDLY if a binary or the manifest is missing — never a
      # release published with a silently-broken daemon installer
      # (bootstrap::install::daemon_binary_path would only discover it much later, at
      # actual use).
      - name: Verify the daemon is bundled before the Tauri build
        run: |
          set -euo pipefail
          DIR=src-tauri/resources/flightdeckd
          if [ ! -s "$DIR/manifest.json" ]; then
            echo "::error::$DIR/manifest.json is missing or empty — did the packaging step fail silently?"
            exit 1
          fi
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
            if [ ! -s "$DIR/flightdeckd-$t" ]; then
              echo "::error::$DIR/flightdeckd-$t is missing or empty — did the 'daemon' or 'daemon-macos' job fail silently?"
              exit 1
            fi
            if ! node -e "process.exit(require('./$DIR/manifest.json').targets['$t'] ? 0 : 1)"; then
              echo "::error::$DIR/manifest.json has no entry for $t — the app would refuse to upload that build"
              exit 1
            fi
          done
          echo "✓ the four flightdeckd binaries + their manifest are present before the Tauri build."

      # Signature de CODE macOS avec un certificat AUTO-SIGNÉ stable → Designated
      # Requirement fixe (`certificate leaf = H"…"`, épinglée au HASH DU CERT, PAS au
      # cdhash) → macOS TCC garde les autorisations de dossier (Bureau/Documents/…) d'une
      # version à l'autre au lieu de tout redemander à chaque auto-update. On installe
      # l'identité dans un keychain dédié PUIS on la TRUST : un cert self-signed est sinon
      # « invalide » pour `find-identity -v` → Tauri échoue (« failed to resolve signing
      # identity »). sudo est non-interactif sur les runners GitHub → trust en domaine
      # système. La notarisation est skippée (pas de APPLE_ID/APPLE_API_KEY) → Gatekeeper
      # reste (clic droit → Ouvrir), problème SÉPARÉ (Developer ID payant).
      # ⚠️ DR-CRITIQUE : toujours le MÊME certificat (réémettre = nouvelle DR = re-grant TCC
      # global pour tous). Cert (~20 ans) + mdp sauvegardés hors repo, comme la clé updater.
      # Secrets absents ⇒ étape no-op ⇒ build NON signé (comportement historique).
      # Same certificate on every macOS leg → the Intel app carries the SAME DR as the
      # Apple Silicon one (TCC is per machine; both keep their grants across updates).
      - name: Configurer la signature macOS (certificat auto-signé trusté)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "Aucun certificat (secret absent) → build NON signé (comportement historique)."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/tosse-signing.keychain-db"
          KCPW="$(openssl rand -hex 20)"
          CERT_P12="$RUNNER_TEMP/cert.p12"
          CERT_CRT="$RUNNER_TEMP/cert.crt"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_P12"
          # Keychain dédié, déverrouillé ; -lut 21600 = timeout de lock à 6h (> durée de build).
          security create-keychain -p "$KCPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KCPW" "$KEYCHAIN"
          # Import + autorise codesign à utiliser la clé sans prompt (partition list).
          security import "$CERT_P12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPW" "$KEYCHAIN" >/dev/null
          # Le keychain doit être dans la search list (le bundler résout l'identité par là).
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')
          # TRUST du cert self-signed pour la signature de code (sinon find-identity -v = 0).
          security find-certificate -c "$APPLE_SIGNING_IDENTITY" -p "$KEYCHAIN" > "$CERT_CRT"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$CERT_CRT"
          rm -f "$CERT_P12" "$CERT_CRT"
          echo "Identité de signature disponible :"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # No updater key here, on purpose: this step runs `pnpm build` (beforeBuildCommand),
      # i.e. Vite and every npm package it loads (see "Signing keys" in the header). Tauri
      # will not build updater artifacts without the private key, so they are switched off
      # for this build only (tauri.conf.json keeps `createUpdaterArtifacts: true`, which
      # nothing reads at runtime): "Pack the updater archive" below makes the archive and
      # the `sign` job signs it.
      - name: Build the app (${{ matrix.target }})
        env:
          # Signature de CODE macOS : l'identité (cert auto-signé stable) a été installée
          # dans un keychain TRUSTÉ par l'étape « Configurer la signature macOS » ci-dessus.
          # Ici on ne passe QUE le nom d'identité, que le bundler Tauri résout dans la
          # search list. ⚠️ NE PAS remettre APPLE_CERTIFICATE ici : Tauri referait alors son
          # propre keychain NON trusté et échouerait (« failed to resolve signing identity »).
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # An EMPTY identity is not "no identity" to the Tauri CLI: it tries to sign
          # with "" and fails ("no identity found"). Unset, it builds unsigned — the
          # historical no-secret behaviour (tauri-action used to give it for free).
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then unset APPLE_SIGNING_IDENTITY; fi
          pnpm tauri build --target "$TARGET" --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # The app uploads a bundled daemon only after checking its bytes against
      # manifest.json (bootstrap::install::verify_daemon_binary_sha256) — so a bundle step
      # that rewrote one (code signing re-signing a Mach-O it found in Resources) would
      # ship an app whose "Update the daemon" always fails as "tampered". Checked in THIS
      # leg's built .app, by exact path, before anything is published.
      - name: Verify the bundled daemons still match their manifest
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          PRODUCT="$(node -p "require('./src-tauri/tauri.conf.json').productName")"
          APP="src-tauri/target/${TARGET}/release/bundle/macos/${PRODUCT}.app"
          if [ ! -d "$APP" ]; then echo "::error::$APP not found — broken build?"; exit 1; fi
          node -e '
            const fs = require("fs"), crypto = require("crypto"), path = require("path");
            const dir = process.argv[1];
            const manifest = JSON.parse(fs.readFileSync(path.join(dir, "manifest.json"), "utf8"));
            let bad = 0;
            for (const [triple, entry] of Object.entries(manifest.targets)) {
              const file = path.join(dir, "flightdeckd-" + triple);
              const got = fs.existsSync(file) ? crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex") : "(missing)";
              if (got === entry.sha256) {
                console.log("✓ " + triple);
              } else {
                console.log("::error::" + triple + ": the bundled binary is " + got + ", its manifest says " + entry.sha256);
                bad++;
              }
            }
            process.exit(bad ? 1 : 0);
          ' "$APP/Contents/Resources/flightdeckd"

      # Anti-régression SILENCIEUSE : le fix TCC ne tient que si l'app PUBLIÉE porte la DR
      # attendue. Un secret présent mais mal nommé/tourné, une app retombée en ad-hoc, ou
      # un cert changé (DR différente) → le leg échoue et RIEN n'est publié, au lieu de
      # publier une app non signée avec une CI verte. Le hash de leaf épinglé garantit AUSSI
      # que c'est toujours le MÊME certificat (DR stable).
      # ⚠️ APPLE_CERTIFICATE absent ⇒ app NON signée VOULUE (comportement historique) → on
      # saute la vérif DR. Sans ce court-circuit, un repo/fork sans les secrets APPLE_*
      # verrait CHAQUE release bloquée.
      # Checked on THIS leg's own app, by exact path — never "the first .app found" — and
      # its CPU architecture with it: an Intel leg that quietly built for arm64 (or the
      # reverse) would hand every Mac of that kind an app it cannot run.
      - name: Verify the app (architecture + signature)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          BINARY_ARCH: ${{ matrix.binary_arch }}
        run: |
          set -euo pipefail
          PRODUCT="$(node -p "require('./src-tauri/tauri.conf.json').productName")"
          APP="src-tauri/target/${TARGET}/release/bundle/macos/${PRODUCT}.app"
          if [ ! -d "$APP" ]; then echo "::error::$APP not found — broken build?"; exit 1; fi
          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/$EXE")"
          if [ "$ARCHS" != "$BINARY_ARCH" ]; then
            echo "::error::$APP is built for '$ARCHS', expected '$BINARY_ARCH'."
            exit 1
          fi
          echo "✓ Architecture: $ARCHS"
          if [ -z "${APPLE_CERTIFICATE:-}" ]; then
            echo "Aucun certificat (secret absent) → app NON signée (comportement historique) : vérif DR ignorée."
            exit 0
          fi
          echo "Vérification de : $APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          EXPECTED_LEAF="2eb75c984971ac7f083775efa6f3c41bb6bd86f2"
          DR="$(codesign -d -r- "$APP" 2>&1 | grep 'designated =>' || true)"
          echo "DR : $DR"
          if ! echo "$DR" | grep -q "certificate leaf = H\"$EXPECTED_LEAF\""; then
            echo "::error::L'app ne porte PAS la DR attendue (leaf $EXPECTED_LEAF) → rien n'est publié. Vérifie les secrets APPLE_*."
            exit 1
          fi
          echo "✓ Signature conforme (DR stable) — TCC persistera d'une version à l'autre."

      # The updater archive — what an installed Mac downloads and installs — packed here
      # since Tauri's bundler no longer makes it (see the build step). Same layout as the
      # bundler's: the .app as the archive's only top-level entry, since the updater drops
      # the first path component of every entry (tauri-plugin-updater, `install_inner`).
      # COPYFILE_DISABLE + --no-mac-metadata/--no-xattrs: no AppleDouble `._*` entry, which
      # would land INSIDE the installed app and break its seal. Then unpacked and compared
      # with the built app, signature included. Unsigned: `sign` signs it.
      - name: Pack the updater archive
        if: runner.os == 'macOS'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          PRODUCT="$(node -p "require('./src-tauri/tauri.conf.json').productName")"
          MACOS="src-tauri/target/${TARGET}/release/bundle/macos"
          APP="$MACOS/${PRODUCT}.app"
          if [ ! -d "$APP" ]; then echo "::error::$APP not found — broken build?"; exit 1; fi
          mkdir -p stage
          # GitHub turns spaces in asset names into dots ("Flight Deck" → "Flight.Deck");
          # naming the files that way up front keeps the URLs in latest.json exact.
          ARCHIVE="stage/${PRODUCT// /.}_${ARCH}.app.tar.gz"
          COPYFILE_DISABLE=1 tar --no-mac-metadata --no-xattrs --no-acls --no-fflags \
            -czf "$ARCHIVE" -C "$MACOS" "${PRODUCT}.app"
          STRAY="$(tar -tzf "$ARCHIVE" | awk -v top="${PRODUCT}.app" '
            $0 != top && index($0, top "/") != 1 { print; next }
            /(^|\/)\._/ { print }')"
          if [ -n "$STRAY" ]; then
            echo "::error::the updater archive holds entries the updater must not install:"
            echo "$STRAY"
            exit 1
          fi
          CHECK="$RUNNER_TEMP/updater-archive-check"
          rm -rf "$CHECK" && mkdir -p "$CHECK"
          tar -xzf "$ARCHIVE" -C "$CHECK"
          diff -r "$APP" "$CHECK/${PRODUCT}.app"
          if codesign --verify --deep --strict "$APP" 2>/dev/null; then
            codesign --verify --deep --strict --verbose=2 "$CHECK/${PRODUCT}.app"
            echo "✓ $ARCHIVE unpacks into the built app, its code signature intact."
          else
            # Only reachable unsigned: a signed app that fails was stopped by "Verify the app".
            echo "✓ $ARCHIVE unpacks into the built app (not code-signed: no certificate)."
          fi

      # The other files this leg contributes to the release, under the names they will
      # have there, plus this leg's line of latest.json (signature added by `publish`,
      # from `sign`).
      - name: Stage the release files
        if: runner.os == 'macOS'
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          PRODUCT="$(node -p "require('./src-tauri/tauri.conf.json').productName")"
          BUNDLE="src-tauri/target/${TARGET}/release/bundle"
          BASE="${PRODUCT// /.}"
          shopt -s nullglob
          DMGS=("$BUNDLE"/dmg/*.dmg)
          if [ "${#DMGS[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .dmg in $BUNDLE/dmg, found ${#DMGS[@]}"
            exit 1
          fi
          cp "${DMGS[0]}" "stage/${BASE}_${VERSION}_${ARCH}.dmg"
          jq -n \
            --arg platform "$PLATFORM" \
            --arg file "${BASE}_${ARCH}.app.tar.gz" \
            '{platform: $platform, file: $file}' \
            > "stage/updater-${PLATFORM}.json"
          ls -la stage

      - name: Hand the files over to `publish`
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: stage/
          if-no-files-found: error
          retention-days: 3

  # Signs every leg's updater archive with the updater key — the only job that holds it
  # (see "Signing keys" in the header). GitHub hands the job its secrets when it starts,
  # so EVERYTHING that runs in it can reach them: it runs only the Tauri CLI's own prebuilt
  # binary, pinned by version AND sha256, plus GitHub's two artifact actions pinned by
  # commit SHA (never a movable tag here) — no checkout, no npm, no code of ours.
  # Re-pin deliberately: the CLI asset digest is in
  # `gh api repos/tauri-apps/tauri/releases/tags/tauri-cli-v<version>` (the signature
  # format is stable across Tauri 2.x), an action's commit in
  # `gh api repos/actions/<action>/commits/<tag> --jq .sha`.
  # The signatures are checked against the pinned public key by `publish`.
  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: updater-signing
    # Not even a token: it reads nothing of the repo, and download/upload-artifact use the
    # run's own artifact token.
    permissions: {}
    env:
      TAURI_CLI_VERSION: "2.11.2"
      TAURI_CLI_SHA256: "1da3864154731ca0c98436392d4793c70a3f151be7beb59d8aa17092aca53c1e"
    steps:
      - name: Collect every leg's files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Fetch the Tauri CLI (pinned binary, checksum-verified)
        run: |
          set -euo pipefail
          URL="https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/cargo-tauri-x86_64-unknown-linux-gnu.tgz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cargo-tauri.tgz" "$URL"
          echo "${TAURI_CLI_SHA256}  $RUNNER_TEMP/cargo-tauri.tgz" | sha256sum --check --strict -
          mkdir -p "$RUNNER_TEMP/tauri-cli"
          tar -xzf "$RUNNER_TEMP/cargo-tauri.tgz" -C "$RUNNER_TEMP/tauri-cli" cargo-tauri
          GOT="$("$RUNNER_TEMP/tauri-cli/cargo-tauri" --version)"
          if [ "$GOT" != "tauri-cli ${TAURI_CLI_VERSION}" ]; then
            echo "::error::the pinned binary says '$GOT', expected 'tauri-cli ${TAURI_CLI_VERSION}'"
            exit 1
          fi
          echo "✓ $GOT"

      # The key and its passphrase reach this step only, through the environment (never
      # argv). Both are required: the key is only ever stored under a passphrase.
      - name: Sign the updater archives
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD must both be set in the GitHub Environment 'updater-signing' (the key under its passphrase — see scripts/updater-key.mjs)."
            exit 1
          fi
          shopt -s nullglob
          ARCHIVES=(release/*.app.tar.gz)
          if [ "${#ARCHIVES[@]}" -eq 0 ]; then
            echo "::error::no updater archive to sign — did a build leg skip 'Pack the updater archive'?"
            exit 1
          fi
          for ARCHIVE in "${ARCHIVES[@]}"; do
            # stdout only repeats the (public) signature; errors go to stderr.
            "$RUNNER_TEMP/tauri-cli/cargo-tauri" signer sign "$ARCHIVE" > /dev/null
            if [ ! -s "$ARCHIVE.sig" ]; then
              echo "::error::no signature written for $ARCHIVE"
              exit 1
            fi
            echo "✓ signed $(basename "$ARCHIVE")"
          done

      - name: Hand the signatures over to `publish`
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updater-signatures
          path: release/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 3

  # Only reached when EVERY build leg succeeded and `sign` signed their archives. Builds
  # latest.json, checks its signatures against the pinned key, creates the release as a
  # draft with every file, checks it, then publishes — or, on a dry run, leaves the draft
  # for inspection. Needs no signing secret: everything it uploads is already signed.
  publish:
    needs: [prepare, build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      # Every platform the build matrix produces — keep in step with it. Nothing is
      # published unless latest.json carries each of them: an installed app whose
      # platform is missing would fail its update check.
      EXPECTED_PLATFORMS: "darwin-aarch64 darwin-x86_64"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect every leg's files
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Collect the updater signatures (sign job)
        uses: actions/download-artifact@v4
        with:
          name: updater-signatures
          path: release

      # Corps de la release = les nouveautés du CHANGELOG.md (affichées DANS l'app via
      # l'updater) + la note d'installation APRÈS un marqueur `<!-- gh-only -->`
      # (visible seulement sur la page GitHub — l'app la masque, cf. `inAppReleaseNotes`).
      # Le CHANGELOG est rempli au moment du bump par le skill `/release`. The same text
      # goes into latest.json's `notes`, which is what the app actually shows.
      - name: Composer les notes de release
        run: |
          set -euo pipefail
          # Section « ## vX.Y.Z » du CHANGELOG, jusqu'au prochain titre « ## ».
          SECTION="$(awk -v ver="$VERSION" '
            /^## / { if (cap) exit; if (index($0, "v" ver) > 0) { cap=1; next } }
            cap { print }
          ' CHANGELOG.md 2>/dev/null || true)"
          # Vide (section absente / CHANGELOG manquant) → repli générique : on ne bloque
          # JAMAIS une release pour des notes manquantes.
          if [ -z "$(printf '%s' "$SECTION" | tr -d '[:space:]')" ]; then
            SECTION="- Améliorations et corrections diverses."
          fi
          # La note d'installation vit dans un fichier (pas de heredoc à la colonne 0
          # qui casserait le bloc YAML) : on l'ajoute après le marqueur.
          {
            printf '%s\n\n' "$SECTION"
            echo '<!-- gh-only -->'
            echo ""
            cat .github/release-install-note.md
          } > release-notes.md
          echo "Notes de release composées pour v$VERSION."

      # The updater manifest, built from what the legs actually produced and `sign`
      # signed. Each platform gets two keys, as tauri-action used to write them:
      # `<os>-<arch>` and the installer-specific `<os>-<arch>-app` the updater looks up
      # first. A signature goes in without its trailing newline: the updater decodes it
      # as strict base64.
      - name: Assemble latest.json (every platform, or nothing)
        run: |
          set -euo pipefail
          URL_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          for META in release/updater-*.json; do
            FILE="$(jq -r '.file' "$META")"
            if [ ! -s "release/$FILE.sig" ]; then
              echo "::error::$FILE has no signature from the 'sign' job — nothing is published."
              exit 1
            fi
            jq --rawfile signature "release/$FILE.sig" \
              '. + {signature: ($signature | gsub("\\s+$"; ""))}' "$META" > "$META.tmp"
            mv "$META.tmp" "$META"
          done
          jq -n \
            --arg version "$VERSION" \
            --rawfile notes release-notes.md \
            --arg pub_date "$PUB_DATE" \
            --arg base "$URL_BASE" \
            '{version: $version, notes: $notes, pub_date: $pub_date,
              platforms: (reduce inputs as $p ({};
                . + {($p.platform): {signature: $p.signature, url: "\($base)/\($p.file)"},
                     ($p.platform + "-app"): {signature: $p.signature, url: "\($base)/\($p.file)"}}))}' \
            release/updater-*.json > release/latest.json
          rm release/updater-*.json
          for P in $EXPECTED_PLATFORMS; do
            if ! jq -e --arg p "$P" '(.platforms[$p].signature // "") != "" and (.platforms[$p + "-app"].url // "") != ""' release/latest.json >/dev/null; then
              echo "::error::latest.json has no '$P' entry — nothing is published (the Macs on that platform would fail their update check)."
              exit 1
            fi
          done
          echo "✓ latest.json platforms: $(jq -r '.platforms | keys | join(", ")' release/latest.json)"

      # What every installed app will check before installing — so checked here, first:
      # each signature of latest.json, against the file its url names, under the public
      # key the apps pin (src-tauri/tauri.conf.json). A secret holding another key, a
      # signature mangled on its way here, an archive swapped after signing: stopped
      # before anything is published, instead of an update every Mac refuses.
      - name: Verify the updater signatures against the pinned key
        run: node scripts/updater-signature.mjs verify-manifest release/latest.json release

      - name: Create the release as a DRAFT with every file
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ inputs.dry_run && format('Flight Deck v{0} (dry run)', needs.prepare.outputs.version) || format('Flight Deck v{0}', needs.prepare.outputs.version) }}
          PRERELEASE: ${{ inputs.prerelease && '--prerelease' || '' }}
        run: |
          set -euo pipefail
          # Draft first: nothing is visible (and `releases/latest` does not move) until
          # the check below has passed. A draft creates no git tag either.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "$TITLE" --notes-file release-notes.md $PRERELEASE \
            release/*

      - name: Check the draft carries every file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd release && ls -1) | sort > expected.txt
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > uploaded.txt
          if ! diff expected.txt uploaded.txt; then
            echo "::error::the draft's assets differ from the built files (diff above) — left as a draft, nothing published."
            exit 1
          fi
          echo "✓ $(wc -l < uploaded.txt | tr -d ' ') files on the draft:"
          cat uploaded.txt

      - name: Publish the release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

      - name: Dry run — where the draft is, and how to remove it
        if: ${{ inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          {
            echo "## Dry run — nothing was published"
            echo ""
            echo "Draft: $URL"
            echo ""
            echo "Delete it once inspected:"
            echo ""
            echo "    gh release delete $TAG --repo $GITHUB_REPOSITORY --yes"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Dry run: draft $TAG left for inspection — $URL"
