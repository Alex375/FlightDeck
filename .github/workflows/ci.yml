# Tests — tournent à l'ouverture/MAJ d'une PR vers `main`.
# PAS sur push (on pousse librement dans `dev`) : la validation se fait au
# moment de la PR dev → main. Ce check est requis par la protection de `main`
# (la PR ne peut pas être mergée tant qu'il n'est pas vert).
#
# ⚠️ `workflow_dispatch` est là parce que le déclencheur `pull_request` a déjà
# fait défaut UNE fois : la PR #42 (release v1.5.0) a été ouverte sans qu'aucun
# run ne parte — workflow `active`, repo public (donc pas de quota), `ci.yml`
# inchangé depuis le dernier run vert. Sans issue de secours, la seule façon de
# récupérer était de pousser un commit vide ou de fermer/rouvrir la PR, ce qui
# revient à bricoler l'historique pour réveiller la CI. Ici on relance à la
# demande sur n'importe quelle branche :
#   gh workflow run ci.yml --ref dev
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 (≥ 22.13) requis par pnpm@11.7.0 (cf. release.yml).
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # The Intel Mac target, for the `cargo check` below (the runner itself is arm64).
          targets: x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Installer les dépendances JS
        run: pnpm install --frozen-lockfile

      - name: Typecheck + build front
        run: pnpm build # = tsc --noEmit && vite build (produit aussi dist/ pour tauri-build)

      - name: Tests unitaires front (vitest)
        run: pnpm test # = vitest run (jsdom)

      - name: Tests des scripts de build (node --test)
        run: pnpm test:scripts # pin du contrat de target-triple Rust<->JS (scripts/build-daemon.test.mjs) — pas de Docker requis

      - name: Tests unitaires Rust
        working-directory: src-tauri
        run: cargo test --lib

      # The Intel Mac build compiles a different wake-word module (`ort` has no
      # x86_64-apple-darwin build — see Cargo.toml and `wake/mod.rs`), which nothing
      # above compiles. Checking it here catches an Intel break at the PR instead of
      # on release day. Cross-checked from this arm64 runner: GitHub is retiring its
      # Intel macOS runners. `check` does not link — the release build does that.
      - name: Check the Intel Mac build compiles (x86_64)
        working-directory: src-tauri
        run: cargo check --lib --tests --target x86_64-apple-darwin

  # The app on Linux: check + unit tests on ubuntu-22.04, the Linux build's glibc
  # baseline. Unit tests only, nothing is bundled (no Linux release yet). Moved here
  # from port-check.yml once green, so the Linux port cannot regress unnoticed. It
  # blocks a merge only if `linux` is listed among main's required checks.
  linux:
    name: linux
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri 2's Linux prerequisites (webkit2gtk 4.1 & co), ALSA for cpal, D-Bus for the
      # Secret Service client (`keyring`, linux_secrets/).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev libasound2-dev \
            libdbus-1-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # `tauri::generate_context!` embeds dist/, so it must exist. The front typecheck
      # and tests already run in `test` above.
      - name: Build front (dist/ for tauri-build)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm exec vite build

      # SERIAL on Linux. Linux spawns a child as fork → exec, and the child holds a copy of
      # every fd open at the fork until its exec closes them. Tests run in parallel threads
      # of ONE process, so a test spawning a process could keep another test's just-closed
      # listener (EADDRINUSE) or just-written fake executable (ETXTBSY, "Text file busy")
      # alive for a few ms — random failures, about one run in five. macOS spawns
      # atomically (posix_spawn) and stays parallel in `test`. Serial costs ~1 minute.
      - name: Rust unit tests (serial)
        working-directory: src-tauri
        run: cargo test --lib -- --test-threads=1

  # flightdeckd is a standalone Rust package (own Cargo.toml/Cargo.lock, not a
  # workspace member of src-tauri — see flightdeckd/docs/MONOREPO-MOVE.md), so
  # it gets its own job rather than folding into `test` above. ubuntu-latest
  # on purpose: production flightdeckd instances run on Linux (systemd,
  # SO_PEERCRED), and that's cheaper than macOS runners for a job that has no
  # front-end/Tauri work to do.
  flightdeckd:
    name: flightdeckd
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./flightdeckd -> target
          # Own cache key: this crate's Cargo.lock is independent of
          # src-tauri's, and the two jobs must never share (or fight over) a
          # cache entry.
          shared-key: flightdeckd

      - name: Tests (flightdeckd)
        working-directory: flightdeckd
        run: cargo test
